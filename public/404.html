<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>FVN Consultores</title>
    <script>
      // Redireciona 404 do GitHub Pages para o index.html preservando a rota,
      // permitindo que o React Router assuma o roteamento client-side.
      var pathSegmentsToKeep = 1 // mantém o segmento do nome do repositório (/fnv-site/)
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
